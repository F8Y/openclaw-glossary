# Самодостаточный compose. Клон upstream-репозитория OpenClaw не нужен:
# образ берём готовый из GHCR, скрипты оттуда не используем.
#
# Запуск только через deploy/reconcile.sh — он подставляет --env-file
# из tmpfs. Руками: docker compose --env-file /run/openclaw/env up -d

services:
  gateway:
    # Пин по digest, а не по тегу: latest ломает детерминизм GitOps.
    # Обновление приходит PR-ом от Renovate.
    image: ${OPENCLAW_IMAGE}
    container_name: openclaw-gateway

    # ТОЛЬКО loopback. Docker пишет правила в iptables в обход UFW,
    # поэтому 0.0.0.0 здесь означает "открыто в интернет".
    ports:
      - "127.0.0.1:18789:18789"

    # КОСТЫЛЬ, но вынужденный. С Cloud.ru часть IP из пула
    # api.telegram.org недоступна: 149.154.166.110 таймаутится,
    # 149.154.167.220 отвечает. DNS отдаёт первый, бот молчит.
    #
    # Хрупкость осознанная: если Telegram сменит адреса, канал
    # отвалится молча. Проверять командой с хоста:
    #   curl -4 -sS -m 10 -o /dev/null -w '%{http_code}\n' \
    #        --resolve api.telegram.org:443:149.154.167.220 \
    #        https://api.telegram.org
    extra_hosts:
      - "api.telegram.org:149.154.167.220"

    environment:
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_GATEWAY_BIND: lan
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      # Запасной провайдер: Cloud.ru Foundation Models. Стоит в том же
      # облаке, что и VM, поэтому сетевой путь короче, чем до BotHub.
      CLOUDRU_API_KEY: ${CLOUDRU_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      NODE_ENV: production
      TZ: Europe/Moscow

    volumes:
      - ${OPENCLAW_STATE_DIR}/config:/home/node/.openclaw
      - ${OPENCLAW_STATE_DIR}/workspace:/home/node/.openclaw/workspace
      - ${OPENCLAW_STATE_DIR}/secrets:/home/node/.config/openclaw
      # Плагин хранится в Git. Явный read-only bind гарантирует, что
      # он существует в том же mount namespace, где OpenClaw валидирует
      # plugins.load.paths.
      - ./extensions/glossary-ui:/home/node/.openclaw/extensions/glossary-ui:ro

    # Образ работает под uid 1000 (node). Бинд-маунты должны
    # принадлежать 1000:1000, иначе EACCES при старте.
    user: "1000:1000"

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
      - NET_ADMIN

    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://127.0.0.1:18789/healthz" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    deploy:
      resources:
        limits:
          memory: 2500m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    restart: unless-stopped

  # Сайдкар для CLI-команд. Делит сетевой namespace с гейтвеем,
  # чтобы достучаться до него по 127.0.0.1.
  # Профиль cli => не поднимается при обычном up.
  cli:
    image: ${OPENCLAW_IMAGE}
    profiles: [ "cli" ]
    network_mode: "service:gateway"
    depends_on:
      - gateway
    environment:
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      # Обязательно те же, что у gateway. Ссылка вида
      # {source: env, id: OPENAI_API_KEY} в конфиге памяти
      # разворачивается процессом, который её читает — а `memory index`
      # выполняется здесь, в сайдкаре. Без этих переменных индексация
      # падает с "No API key found", хотя чат работает.
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      CLOUDRU_API_KEY: ${CLOUDRU_API_KEY:-}
    volumes:
      - ${OPENCLAW_STATE_DIR}/config:/home/node/.openclaw
      - ${OPENCLAW_STATE_DIR}/workspace:/home/node/.openclaw/workspace
      - ${OPENCLAW_STATE_DIR}/secrets:/home/node/.config/openclaw
      # CLI валидирует конфиг в отдельном контейнере, поэтому тот же
      # плагин должен быть смонтирован и сюда, а не только в gateway.
      - ./extensions/glossary-ui:/home/node/.openclaw/extensions/glossary-ui:ro
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    entrypoint: [ "node", "dist/index.js" ]
